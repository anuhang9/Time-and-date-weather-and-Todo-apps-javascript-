<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" role="img" aria-labelledby="title desc">
  <title id="title">Anuhang watercolor art logo</title>
  <desc id="desc">An editable vector recreation of a colorful watercolor ring, artist palette, paintbrushes, and the handwritten name Anuhang.</desc>
  <defs>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18aeb4"/><stop offset=".22" stop-color="#55c5bd"/>
      <stop offset=".42" stop-color="#f29a38"/><stop offset=".61" stop-color="#e95c35"/>
      <stop offset=".8" stop-color="#1877a9"/><stop offset="1" stop-color="#f0b72d"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#086a8a"/><stop offset=".23" stop-color="#25a9a7"/>
      <stop offset=".48" stop-color="#e8a12f"/><stop offset=".72" stop-color="#ed5b2c"/>
      <stop offset="1" stop-color="#1873ad"/>
    </linearGradient>
    <linearGradient id="letterBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24b8ce"/><stop offset=".45" stop-color="#07548d"/><stop offset="1" stop-color="#162e69"/></linearGradient>
    <linearGradient id="letterGreen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66bf56"/><stop offset=".5" stop-color="#079d8e"/><stop offset="1" stop-color="#174f87"/></linearGradient>
    <linearGradient id="letterOrange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb52d"/><stop offset=".48" stop-color="#ef682b"/><stop offset="1" stop-color="#c83b2c"/></linearGradient>
    <linearGradient id="letterRed" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e45c32"/><stop offset=".55" stop-color="#c92e36"/><stop offset="1" stop-color="#8c2453"/></linearGradient>
    <linearGradient id="brushTip" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ee392e"/><stop offset=".35" stop-color="#f7b62c"/><stop offset=".65" stop-color="#15aeb1"/><stop offset="1" stop-color="#2d5aa8"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

